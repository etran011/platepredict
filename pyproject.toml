[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platepredict"
version = "0.1.0"
description = "Reusable nutrition data preparation for PlatePredict"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]
